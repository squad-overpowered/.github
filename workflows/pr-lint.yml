name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest

    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types (must match conventional commits spec)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Allow optional scope: feat(auth): ...
          requireScope: false
          # Subject must not be empty
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" is invalid.
            The subject must:
            - Start with a lowercase letter
            - Not be empty

            Valid examples:
              feat: add player search filters
              fix(auth): resolve token refresh race condition
              refactor(squad-builder): extract formation component
          # Disallow ! for breaking changes at PR level (use BREAKING CHANGE in body)
          disallowScopes: []
          wip: true  # Allow "WIP: ..." titles for work-in-progress PRs
          validateSingleCommit: false
