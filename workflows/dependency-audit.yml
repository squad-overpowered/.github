name: Dependency Audit

on:
  schedule:
    # Every Monday at 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '24.x'

jobs:
  audit:
    name: npm audit + lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          # Run audit and capture output; exit code 1 means vulnerabilities found
          AUDIT_OUTPUT=$(npm audit --json 2>&1 || true)
          VULN_COUNT=$(echo "$AUDIT_OUTPUT" | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try {
                const json = JSON.parse(data);
                const m = json.metadata?.vulnerabilities || {};
                const total = (m.critical||0) + (m.high||0) + (m.moderate||0) + (m.low||0);
                console.log(total);
              } catch { console.log('0'); }
            });
          ")
          CRITICAL=$(echo "$AUDIT_OUTPUT" | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try { const j = JSON.parse(data); console.log(j.metadata?.vulnerabilities?.critical||0); }
              catch { console.log('0'); }
            });
          ")
          HIGH=$(echo "$AUDIT_OUTPUT" | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              try { const j = JSON.parse(data); console.log(j.metadata?.vulnerabilities?.high||0); }
              catch { console.log('0'); }
            });
          ")

          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          # Save full audit summary for the issue body
          npm audit --audit-level=moderate 2>&1 | tail -50 > audit-summary.txt || true

      - name: Run lint on main
        id: lint
        run: |
          npx nx run-many -t lint 2>&1 | tail -30 > lint-summary.txt || true
          LINT_EXIT=$?
          echo "lint_failed=$([[ $LINT_EXIT -ne 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Create issue if vulnerabilities found
        if: steps.audit.outputs.vuln_count != '0' || steps.lint.outputs.lint_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const vulnCount = '${{ steps.audit.outputs.vuln_count }}';
            const critical = '${{ steps.audit.outputs.critical }}';
            const high = '${{ steps.audit.outputs.high }}';
            const lintFailed = '${{ steps.lint.outputs.lint_failed }}' === 'true';

            const auditSummary = fs.existsSync('audit-summary.txt')
              ? fs.readFileSync('audit-summary.txt', 'utf8')
              : 'No audit output available.';
            const lintSummary = fs.existsSync('lint-summary.txt')
              ? fs.readFileSync('lint-summary.txt', 'utf8')
              : 'No lint output available.';

            const today = new Date().toISOString().split('T')[0];
            const title = `chore: weekly dependency audit — ${today} (${vulnCount} vulnerabilities)`;

            const body = [
              '## Weekly Dependency Audit Report',
              `**Date**: ${today}`,
              `**Run**: ${context.runId}`,
              '',
              '### npm audit',
              `- Total vulnerabilities: **${vulnCount}**`,
              `- Critical: **${critical}**`,
              `- High: **${high}**`,
              '',
              '```',
              auditSummary.slice(0, 3000),
              '```',
              '',
              lintFailed ? '### Lint issues detected\n```\n' + lintSummary.slice(0, 2000) + '\n```' : '### Lint: ✅ No issues',
              '',
              '---',
              '_This issue was created automatically by the Dependency Audit workflow._',
              '_Close it once the vulnerabilities have been resolved or triaged._',
            ].join('\n');

            // Check if a similar open issue already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies', 'security-audit'],
            });

            if (existing.data.length > 0) {
              // Update existing issue instead of creating a duplicate
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body,
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dependencies', 'security-audit', 'automated'],
              });
              console.log('Created new audit issue');
            }

      - name: Post summary
        if: always()
        run: |
          echo "## Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerabilities found: **${{ steps.audit.outputs.vuln_count }}**" >> $GITHUB_STEP_SUMMARY
          echo "  - Critical: ${{ steps.audit.outputs.critical }}" >> $GITHUB_STEP_SUMMARY
          echo "  - High: ${{ steps.audit.outputs.high }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ steps.lint.outputs.lint_failed == 'true' && '❌ Issues found' || '✅ Clean' }}" >> $GITHUB_STEP_SUMMARY
