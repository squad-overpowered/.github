name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '24.x'

jobs:
  release-please:
    name: Create release PR or tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Uses conventional commits to determine next version:
          # feat: → minor bump, fix:/perf: → patch bump, feat!: → major bump
          release-type: node
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Only runs when release-please actually creates a release (not just a PR)
  publish:
    name: Build release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npx nx build frontend --configuration=production

      - name: Build backend (production)
        run: npx nx build backend --configuration=production

      - name: Create release archives
        run: |
          cd dist/apps
          tar -czf frontend-${{ needs.release-please.outputs.tag_name }}.tar.gz frontend/
          tar -czf backend-${{ needs.release-please.outputs.tag_name }}.tar.gz backend/

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            dist/apps/frontend-${{ needs.release-please.outputs.tag_name }}.tar.gz \
            dist/apps/backend-${{ needs.release-please.outputs.tag_name }}.tar.gz
