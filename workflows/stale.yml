name: Stale Issues & PRs

on:
  schedule:
    # Runs daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Issues ──────────────────────────────────────────────────
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been inactive for 30 days and is marked as stale.
            If this is still relevant, please add a comment or remove the `stale` label.
            It will be closed in 7 days if there is no further activity.
          close-issue-message: >
            This issue was closed automatically after 7 days of inactivity since being marked stale.
            Feel free to reopen it if the problem is still present.
          close-issue-reason: not_planned

          # ── Pull Requests ────────────────────────────────────────────
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been inactive for 14 days and is marked as stale.
            Please rebase, address review comments, or leave a comment to keep it open.
            It will be closed in 7 days if there is no further activity.
          close-pr-message: >
            This PR was closed automatically after 7 days of inactivity since being marked stale.
            Feel free to reopen it when you are ready to continue.

          # ── Labels that prevent staleness ───────────────────────────
          exempt-issue-labels: >
            pinned,
            security-audit,
            bug,
            in-progress,
            blocked,
            needs-design
          exempt-pr-labels: >
            pinned,
            in-progress,
            blocked,
            do-not-merge,
            work-in-progress

          # ── Misc ─────────────────────────────────────────────────────
          # Don't mark draft PRs as stale
          exempt-draft-pr: true
          # Process up to 100 items per run to stay within rate limits
          operations-per-run: 100
          # Remove stale label if there is new activity
          remove-stale-when-updated: true
          # Don't close issues with a milestone — they are planned work
          exempt-all-milestones: true
