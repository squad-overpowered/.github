name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full scan every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # CodeQL supports: javascript-typescript, python, java-kotlin, csharp, cpp, go, ruby, swift

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Extended security queries — covers OWASP Top 10 patterns
          queries: security-extended
          config: |
            paths-ignore:
              - dist/
              - node_modules/
              - coverage/
              - '**/*.spec.ts'
              - '**/*.test.ts'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (required for accurate analysis)
        run: |
          npx nx build frontend --configuration=development || true
          npx nx build backend --configuration=development || true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          upload: true
          # Results appear in GitHub Security tab → Code scanning alerts
